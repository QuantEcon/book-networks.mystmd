version: 1
project:
  # (i)/(a) list markers: the fork parses them, book-theme renders every
  # ordered list as 1., 2., ...; this plugin + fancy-lists.css draw the print
  # markers. Copied from QuantEcon/book-dp2's mystmd/.
  plugins:
    - fancy-lists.mjs
  title: "Economic Networks: Theory and Computation"
  description: >-
    An introduction to economic networks for students and researchers in
    economics and applied mathematics, emphasizing quantitative modeling with
    graph theory, linear algebra, fixed point theory and programming.
  keywords:
    - economic networks
    - network science
    - graph theory
    - production networks
    - optimal transport
    - Markov chains
    - financial networks
    - quantitative economics
  authors:
    - name: Thomas J. Sargent
      affiliations:
        - New York University
    - name: John Stachurski
      affiliations:
        - National Graduate Institute for Policy Studies (GRIPS)
  # The Cambridge University Press edition; the theme shows it on every page.
  doi: 10.1017/9781009456340
  subject: Economics
  venue:
    title: QuantEcon
    url: https://quantecon.org
  # The LaTeX source is private: the GitHub link points at the public repo
  # the site is published from, and there is no edit link.
  github: https://github.com/QuantEcon/book-networks.mystmd
  edit_url: null
  # The book as a PDF, copied in by scripts/publish.sh.
  downloads:
    - file: economic-networks.pdf
      title: PDF version
  bibliography:
    - references.bib
  # Book-mode numbering as in print: chapters 1-5, then the appendix as
  # chapter 6 under the part "Appendices". Theorem-likes are numbered within
  # sections, and lemma, proposition and corollary share the theorem counter
  # (preamble.tex: \newtheorem{lemma}[theorem]{Lemma}); exercises are numbered
  # within sections too (\counterwithin{Exercise}{section}).
  numbering:
    book:
      enabled: true
    chapters:
      label: "Chapter %s"
    proof:
      scope: section
    proof:lemma:       { counter: theorem }
    proof:proposition: { counter: theorem }
    proof:corollary:   { counter: theorem }
    exercise:
      scope: section
    code:
      continue: true
      template: "Listing %s"
    proof:algorithm:
      continue: true
  toc:
    - file: index.md
    - title: Front Matter
      section: frontmatter
      children:
        - file: ch_preface.md
          title: Preface
        - file: common_symbols.md
          title: Common Symbols
    - title: Chapters
      section: chapters
      children:
        - file: ch_intro.md
          title: Introduction
        - file: ch_production.md
          title: Production
        - file: ch_opt.md
          title: Optimal Flows
        - file: ch_mcs.md
          title: Markov Chains and Networks
        - file: ch_fpms.md
          title: Nonlinear Interactions
    - title: Appendices
      section: parts
      children:
        - file: appendix.md
          title: Appendix
  # Generated from ../preamble.tex (KaTeX: \mathbbm -> \mathbb).

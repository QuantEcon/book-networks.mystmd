site:
  template: book-theme
  options:
    style: fancy-lists.css
    # base_url comes from BASE_URL in the deploy workflow
  parts:
    footer: |
      © Thomas J. Sargent and John Stachurski. The final version of *Economic
      Networks: Theory and Computation* is published by
      [Cambridge University Press](https://www.cambridge.org/core/books/economic-networks/2684D7986C7E48A82A762DFEEEA49B46)
      (2024). Available for indexing, text and data mining, and AI model
      training, with attribution.
